repos:
  - repo: local
    hooks:
      # Pre-commit: state machine codegen check
      - id: codegen-check
        name: State Machine Codegen Parity Check
        entry: task codegen-check
        language: system
        pass_filenames: false
        always_run: true

      # Pre-commit: python lint & format (Ruff)
      - id: ruff-lint
        name: Ruff Lint
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: ruff format
        language: system
        types: [python]

      # Pre-commit: fast lint gate
      - id: odin-lint
        name: odin check (vet + strict-style)
        entry: odin check src/ -vet -strict-style -warnings-as-errors
        language: system
        pass_filenames: false
        always_run: true

      # Pre-push: full build + test suite
      - id: odin-build
        name: odin build (debug)
        entry: task build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: odin-test-unit
        name: odin test (unit)
        entry: odin test tests/ -out:/tmp/odin-test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: odin-test-cli
        name: odin test (CLI)
        entry: odin test src/ -out:/tmp/odin-test-cli
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: odin-test-shader
        name: odin test (shader CPU)
        entry: odin test src/rendering/shader/ -out:/tmp/odin-test-shader
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # NOTE: GL headless tests removed from pre-push hook — they take ~60s and
      # cause SSH timeout (GitHub closes idle connections during hook execution).
      # GL tests run in CI (GitHub Actions) and via `task push` locally.

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
